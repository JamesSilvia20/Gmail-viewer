<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="comfortable">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  /* Spacing — 4/8 scale */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px;

  /* Radius scale */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --r-full: 999px;

  /* Hero gradient — Aurora (the ONE gradient, reused everywhere) */
  --aurora: linear-gradient(135deg, #6366F1 0%, #8B5CF6 48%, #D946EF 100%);
  --aurora-soft: linear-gradient(135deg, rgba(99,102,241,.16), rgba(217,70,239,.16));

  /* Brand primary */
  --primary: #7C5CFC;
  --primary-strong: #6D5EF6;

  /* Accent label palette */
  --c-emerald: #10B981; --c-amber: #F59E0B; --c-rose: #F43F5E;
  --c-sky: #0EA5E9;     --c-violet: #8B5CF6; --c-pink: #EC4899;

  /* Semantic */
  --success: #10B981; --warning: #F59E0B; --danger: #F43F5E; --info: #0EA5E9;

  /* Motion */
  --t-fast: 150ms; --t-base: 200ms; --ease: cubic-bezier(.4,0,.2,1);

  /* Type */
  --font: 'Inter', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

/* DARK THEME (default) */
[data-theme="dark"] {
  --bg:        #0A0A0F;
  --bg-grad:   radial-gradient(1200px 800px at 12% -8%, rgba(124,92,252,.10), transparent 60%),
               radial-gradient(900px 700px at 100% 0%, rgba(217,70,239,.06), transparent 55%),
               #0A0A0F;
  --surface:   #101018;
  --surface-2: #16161F;
  --surface-3: #1D1D29;
  --glass:     rgba(22,22,31,.62);
  --border:    rgba(255,255,255,.07);
  --border-2:  rgba(255,255,255,.12);
  --text:      #ECECF4;
  --text-2:    #9A9AB0;
  --text-3:    #5E5E76;
  --unread:    #FBFBFF;
  --hover:     rgba(255,255,255,.04);
  --selected:  rgba(124,92,252,.12);
  --shadow-1:  0 1px 2px rgba(0,0,0,.4);
  --shadow-2:  0 8px 24px -6px rgba(0,0,0,.55);
  --shadow-3:  0 24px 64px -12px rgba(0,0,0,.7);
  --ring:      rgba(139,92,246,.55);
  color-scheme: dark;
}

/* LIGHT THEME */
[data-theme="light"] {
  --bg:        #F4F4FA;
  --bg-grad:   radial-gradient(1200px 800px at 10% -10%, rgba(124,92,252,.10), transparent 55%),
               radial-gradient(900px 700px at 100% 0%, rgba(217,70,239,.07), transparent 50%),
               #F4F4FA;
  --surface:   #FFFFFF;
  --surface-2: #FAFAFE;
  --surface-3: #F0F0F8;
  --glass:     rgba(255,255,255,.7);
  --border:    rgba(15,15,40,.08);
  --border-2:  rgba(15,15,40,.13);
  --text:      #15151F;
  --text-2:    #5A5A70;
  --text-3:    #9C9CB2;
  --unread:    #0B0B14;
  --hover:     rgba(15,15,40,.035);
  --selected:  rgba(124,92,252,.10);
  --shadow-1:  0 1px 2px rgba(20,20,50,.06);
  --shadow-2:  0 10px 30px -8px rgba(30,20,70,.16);
  --shadow-3:  0 28px 70px -14px rgba(30,20,70,.24);
  --ring:      rgba(124,92,252,.45);
  color-scheme: light;
}

/* ============================================================
   BASE
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg-grad); background-attachment: fixed;
  color: var(--text);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow: hidden;
  transition: background var(--t-base) var(--ease), color var(--t-base) var(--ease);
}
button, input, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--r-sm); }
::selection { background: rgba(139,92,246,.3); }

/* Scrollbars */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: content-box; }

.gradient-text {
  background: var(--aurora); -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
svg.ic { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.9;
  fill: none; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

/* ============================================================
   APP SHELL
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w, 268px) minmax(360px, 460px) 1fr;
  height: 100vh; width: 100vw; overflow: hidden;
  transition: grid-template-columns var(--t-base) var(--ease);
}
.app.collapsed { --sidebar-w: 76px; }

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar {
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: var(--s-4); gap: var(--s-2);
  overflow: hidden; min-width: 0;
}
.brand { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) var(--s-2) var(--s-4); }
.brand-mark {
  width: 38px; height: 38px; border-radius: var(--r-md); background: var(--aurora);
  display: grid; place-items: center; flex: 0 0 auto;
  box-shadow: 0 6px 20px -4px rgba(124,92,252,.6);
}
.brand-mark svg { width: 21px; height: 21px; stroke: #fff; stroke-width: 2.2; fill: none; }
.brand-name { font-size: 18px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
.brand-name b { font-weight: 800; }
.collapse-btn {
  margin-left: auto; color: var(--text-3); width: 30px; height: 30px;
  border-radius: var(--r-sm); display: grid; place-items: center;
  transition: background var(--t-fast), color var(--t-fast);
}
.collapse-btn:hover { background: var(--hover); color: var(--text); }

.compose {
  display: flex; align-items: center; justify-content: center; gap: var(--s-2);
  background: var(--aurora); color: #fff; font-weight: 650; font-size: 15px;
  padding: 13px var(--s-4); border-radius: var(--r-md); white-space: nowrap;
  box-shadow: 0 8px 24px -6px rgba(124,92,252,.55);
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), filter var(--t-fast);
}
.compose:hover { transform: translateY(-1px); box-shadow: 0 12px 30px -6px rgba(124,92,252,.7); filter: saturate(1.1); }
.compose:active { transform: translateY(0); }
.compose svg { stroke: #fff; }

.nav { display: flex; flex-direction: column; gap: 2px; margin-top: var(--s-2); }
.sect-label {
  font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-3); padding: var(--s-4) var(--s-3) var(--s-2); white-space: nowrap;
}
.nav-item {
  display: flex; align-items: center; gap: var(--s-3); padding: 9px var(--s-3);
  border-radius: var(--r-sm); color: var(--text-2); font-size: 14px; font-weight: 500;
  position: relative; white-space: nowrap; width: 100%; text-align: left;
  transition: background var(--t-fast), color var(--t-fast);
}
.nav-item:hover { background: var(--hover); color: var(--text); }
.nav-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.nav-item .count {
  font-size: 12px; font-weight: 600; color: var(--text-3); font-variant-numeric: tabular-nums;
}
.nav-item.active {
  background: var(--aurora-soft); color: var(--text);
}
.nav-item.active::before {
  content: ""; position: absolute; left: -16px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 22px; border-radius: 99px; background: var(--aurora);
}
.nav-item.active svg { stroke: var(--primary); }
.nav-item.active .count { color: var(--primary); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }

.sidebar .spacer { flex: 1; }

.profile {
  display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2);
  border-radius: var(--r-md); border: 1px solid var(--border);
  background: var(--surface-2); margin-top: var(--s-2); white-space: nowrap;
  transition: border-color var(--t-fast);
}
.profile:hover { border-color: var(--border-2); }
.profile .meta { min-width: 0; flex: 1; }
.profile .nm { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.profile .em { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; }
.profile .chev { color: var(--text-3); }

.avatar {
  border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto;
  color: #fff; font-weight: 700; font-size: 13px; letter-spacing: -.01em; overflow: hidden;
}

/* collapsed sidebar */
.app.collapsed .brand-name, .app.collapsed .compose span,
.app.collapsed .nav-item .label, .app.collapsed .nav-item .count,
.app.collapsed .sect-label, .app.collapsed .profile .meta,
.app.collapsed .profile .chev { display: none; }
.app.collapsed .compose { padding: 13px 0; }
.app.collapsed .nav-item { justify-content: center; }
.app.collapsed .brand { justify-content: center; }
.app.collapsed .collapse-btn { display: none; }
.app.collapsed .profile { justify-content: center; }
.app.collapsed .nav-item .dot { position: absolute; top: 6px; right: 10px; }

/* ============================================================
   LIST COLUMN
   ============================================================ */
.list-col { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); background: var(--surface); }

.topbar {
  display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4);
  border-bottom: 1px solid var(--border); position: relative; z-index: 5;
}
.search {
  flex: 1; position: relative; min-width: 0;
}
.search .si { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.search input {
  width: 100%; background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border: 1px solid var(--border-2); border-radius: var(--r-md); padding: 10px 70px 10px 40px;
  font-size: 14px; outline: none; transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.search input::placeholder { color: var(--text-3); }
.search input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--selected); }
.kbd {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-family: var(--mono); font-size: 11px; color: var(--text-3);
  border: 1px solid var(--border-2); border-radius: 6px; padding: 2px 7px;
  pointer-events: none; background: var(--surface-2);
}
.icon-btn {
  width: 38px; height: 38px; border-radius: var(--r-md); display: grid; place-items: center;
  color: var(--text-2); border: 1px solid transparent;
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
}
.icon-btn:hover { background: var(--hover); color: var(--text); border-color: var(--border); }
.account-chip {
  display: flex; align-items: center; gap: var(--s-2); padding: 4px 12px 4px 4px;
  border: 1px solid var(--border-2); border-radius: var(--r-full); white-space: nowrap;
  transition: border-color var(--t-fast);
}
.account-chip:hover { border-color: var(--primary); }
.account-chip .nm { font-size: 13px; font-weight: 500; }

/* list toolbar */
.list-tools {
  display: flex; align-items: center; gap: var(--s-2); padding: var(--s-3) var(--s-4);
  border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.scopes { display: flex; gap: 6px; flex: 1; min-width: 0; overflow: hidden; }
.scope {
  font-size: 12.5px; font-weight: 550; padding: 5px 12px; border-radius: var(--r-full);
  color: var(--text-2); border: 1px solid var(--border); white-space: nowrap;
  transition: all var(--t-fast);
}
.scope:hover { color: var(--text); border-color: var(--border-2); }
.scope.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.seg {
  display: flex; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden;
}
.seg button { padding: 6px 9px; color: var(--text-3); display: grid; place-items: center; transition: all var(--t-fast); }
.seg button.active { background: var(--surface-3); color: var(--text); }
.seg button:hover:not(.active) { color: var(--text-2); }

.list { flex: 1; overflow-y: auto; overflow-x: hidden; }
.group-head {
  position: sticky; top: 0; z-index: 2; padding: var(--s-4) var(--s-4) var(--s-2);
  font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-3); background: linear-gradient(var(--surface) 70%, transparent);
  backdrop-filter: blur(2px);
}

/* Message row */
.row {
  display: grid; grid-template-columns: auto auto 1fr auto; align-items: start;
  gap: var(--s-3); padding: 13px var(--s-4); cursor: pointer; position: relative;
  border-bottom: 1px solid var(--border);
  transition: background var(--t-fast);
}
.row:hover { background: var(--hover); }
.row.selected { background: var(--selected); }
.row.selected::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--aurora);
}
.row .checkwrap { padding-top: 2px; opacity: 0; transition: opacity var(--t-fast); }
.row:hover .checkwrap, .row .checkwrap.checked, .list.selecting .checkwrap { opacity: 1; }
.cb {
  width: 18px; height: 18px; border-radius: 6px; border: 1.8px solid var(--border-2);
  display: grid; place-items: center; transition: all var(--t-fast); color: transparent;
}
.cb.checked { background: var(--primary); border-color: var(--primary); color: #fff; }

.row .ava-wrap { position: relative; padding-top: 1px; }
.row .avatar { width: 40px; height: 40px; font-size: 15px; }
.unread-dot {
  position: absolute; top: -2px; left: -7px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--aurora); box-shadow: 0 0 0 3px var(--surface);
}
.row.read .unread-dot { display: none; }

.row .body { min-width: 0; }
.row .line1 { display: flex; align-items: center; gap: var(--s-2); }
.row .sender { font-size: 14px; font-weight: 550; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.unread .sender { font-weight: 750; color: var(--unread); }
.row .time { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; flex: 0 0 auto; }
.row.unread .time { color: var(--text-2); font-weight: 600; }
.row .subject { font-size: 13.5px; color: var(--text); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.unread .subject { font-weight: 650; }
.row .snippet { font-size: 13px; color: var(--text-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .chips { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; align-items: center; }
.chip {
  font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: var(--r-full);
  display: inline-flex; align-items: center; gap: 5px;
}
.chip .dot { width: 6px; height: 6px; }
.thread-count {
  font-size: 11px; font-weight: 700; color: var(--text-2); background: var(--surface-3);
  border-radius: var(--r-full); padding: 1px 7px;
}
.attach-ic { color: var(--text-3); }

.row .actions {
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
}
.star { color: var(--text-3); transition: color var(--t-fast), transform var(--t-fast); }
.star:hover { transform: scale(1.18); }
.star.on { color: var(--c-amber); }
.star.on svg { fill: var(--c-amber); }
.hover-actions { display: flex; gap: 2px; opacity: 0; transform: translateX(6px); transition: all var(--t-fast); }
.row:hover .hover-actions { opacity: 1; transform: none; }
.ha-btn { width: 30px; height: 30px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--text-3); transition: all var(--t-fast); }
.ha-btn:hover { background: var(--surface-3); color: var(--text); }
.ha-btn.danger:hover { color: var(--danger); }

/* compact density */
[data-density="compact"] .row { padding: 8px var(--s-4); grid-template-columns: auto auto 1fr auto; }
[data-density="compact"] .row .avatar { width: 30px; height: 30px; font-size: 12px; }
[data-density="compact"] .row .subject, [data-density="compact"] .row .snippet { display: none; }
[data-density="compact"] .row .body { display: flex; align-items: baseline; gap: var(--s-3); }
[data-density="compact"] .row .line1 { flex: 0 0 150px; }
[data-density="compact"] .row .chips { margin-top: 0; }
[data-density="compact"] .row.compact-sub::after {
  content: attr(data-subject); font-size: 13px; color: var(--text-2); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
[data-density="compact"] .row.unread.compact-sub::after { color: var(--text); font-weight: 600; }

/* ============================================================
   READING PANE
   ============================================================ */
.reader { min-width: 0; display: flex; flex-direction: column; background: var(--surface-2); overflow: hidden; }
.reader-scroll { flex: 1; overflow-y: auto; }
.reader .back-btn { display: none; }

.thread-head { padding: var(--s-6) var(--s-8) var(--s-4); border-bottom: 1px solid var(--border); }
.thread-head .top { display: flex; align-items: flex-start; gap: var(--s-4); }
.thread-subject { font-size: 23px; font-weight: 750; letter-spacing: -.025em; line-height: 1.25; flex: 1; }
.thread-head .labels { display: flex; gap: 7px; margin-top: var(--s-3); flex-wrap: wrap; }

.action-bar {
  display: flex; align-items: center; gap: 6px; padding: var(--s-3) var(--s-8);
  border-bottom: 1px solid var(--border); flex-wrap: wrap;
  position: sticky; top: 0; background: var(--surface-2); z-index: 3;
}
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: var(--r-sm);
  font-size: 13.5px; font-weight: 600; color: var(--text-2);
  border: 1px solid var(--border); transition: all var(--t-fast);
}
.btn:hover { background: var(--hover); color: var(--text); border-color: var(--border-2); }
.btn-primary {
  background: var(--aurora); color: #fff; border-color: transparent;
  box-shadow: 0 6px 18px -6px rgba(124,92,252,.5);
}
.btn-primary:hover { color: #fff; filter: saturate(1.1) brightness(1.05); transform: translateY(-1px); }
.btn-primary svg { stroke: #fff; }
.action-bar .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
.action-bar .grow { flex: 1; }

/* message in thread */
.msg { padding: var(--s-6) var(--s-8); border-bottom: 1px solid var(--border); }
.msg-head { display: flex; align-items: center; gap: var(--s-3); }
.msg-head .avatar { width: 44px; height: 44px; font-size: 16px; }
.msg-from { min-width: 0; flex: 1; }
.msg-from .nm { font-size: 15px; font-weight: 700; }
.msg-from .addr { font-size: 13px; color: var(--text-2); }
.msg-from .to { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.msg-meta { display: flex; align-items: center; gap: var(--s-2); color: var(--text-3); font-size: 12.5px; white-space: nowrap; }
.msg-body { font-size: 15px; line-height: 1.72; color: var(--text); margin-top: var(--s-5); max-width: 70ch; }
.msg-body p { margin-bottom: var(--s-4); }
.msg-body strong { color: var(--unread); font-weight: 700; }
.msg-body a { color: var(--primary); text-decoration: none; border-bottom: 1px solid var(--selected); }
.msg-body ul { margin: 0 0 var(--s-4) var(--s-5); }
.msg-body li { margin-bottom: 6px; }
.signature { color: var(--text-2); font-size: 14px; line-height: 1.6; }

/* collapsed earlier message */
.msg.collapsed { padding: var(--s-4) var(--s-8); cursor: pointer; transition: background var(--t-fast); }
.msg.collapsed:hover { background: var(--hover); }
.msg.collapsed .msg-body, .msg.collapsed .msg-from .to, .msg.collapsed .attachments { display: none; }
.msg.collapsed .collapsed-snip { font-size: 13px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.msg .collapsed-snip { display: none; }
.msg.collapsed .msg-head { gap: var(--s-3); }
.msg.collapsed .avatar { width: 32px; height: 32px; font-size: 12px; }

/* attachments */
.attachments { display: flex; gap: var(--s-3); margin-top: var(--s-5); flex-wrap: wrap; }
.att-card {
  display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3); width: 230px;
  border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface);
  transition: all var(--t-fast); cursor: pointer;
}
.att-card:hover { border-color: var(--border-2); box-shadow: var(--shadow-2); transform: translateY(-2px); }
.att-icon { width: 40px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center; color: #fff; flex: 0 0 auto; }
.att-meta { min-width: 0; }

.fmt-bar button:hover { background: var(--hover); color: var(--text); }

/* empty state */
.empty { flex: 1; display: grid; place-items: center; padding: var(--s-8); text-align: center; }
.empty .inner { max-width: 360px; }
.empty .glyph {
  width: 96px; height: 96px; margin: 0 auto var(--s-6); border-radius: var(--r-xl);

.scrim { position: fixed; inset: 0; background: rgba(5,5,12,.5); opacity: 0; pointer-events: none; transition: opacity var(--t-base); z-index: 40; }
.scrim.show { opacity: 1; pointer-events: auto; }
.composer {

.composer-foot { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-4) var(--s-5); border-top: 1px solid var(--border); }

   ============================================================ */
.toasts { position: fixed; bottom: var(--s-6); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: var(--s-2); z-index: 60; align-items: center; }

.toast .undo { margin-left: auto; color: var(--primary); font-weight: 700; font-size: 13px; }
.toast.out { animation: toastOut var(--t-base) var(--ease) forwards; }
@keyframes toastIn { from { transform: translateY(16px); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(16px); opacity: 0; } }

/* ============================================================

   ============================================================ */
.skel-row { display: grid; grid-template-columns: 40px 1fr; gap: var(--s-3); padding: 13px var(--s-4); border-bottom: 1px solid var(--border); }
.skel { background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 50%, var(--surface-3) 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: 7px; }

@keyframes shimmer { to { background-position: -200% 0; } }

/* ============================================================
   FOLDERS / SCOPES
   ============================================================ */
const FOLDERS = [
  {key:'inbox', icon:'inbox', name:'Inbox', count:6},
  {key:'starred', icon:'star', name:'Starred', count:3},
  {key:'sent', icon:'sent', name:'Sent'},
  {key:'drafts', icon:'draft', name:'Drafts', count:2},
  {key:'spam', icon:'spam', name:'Spam', count:1},
  {key:'trash', icon:'trash', name:'Trash'},
  {key:'all', icon:'all', name:'All Mail'},
];
const SCOPES = ['All','Unread','Starred','Has attachment'];

/* ============================================================
   STATE
   ============================================================ */
let state = { folder:'inbox', scope:'All', selectedId:2, checked:new Set(), search:'' };
const $ = s => document.querySelector(s);

/* ============================================================
   RENDER SIDEBAR
   ============================================================ */
function renderNav(){
  $('#nav').innerHTML = FOLDERS.map(f=>`
    <button class="nav-item ${f.key===state.folder?'active':''}" data-folder="${f.key}" ${f.key===state.folder?'aria-current="page"':''}>
      ${ic(f.icon,18)}
      <span class="label">${f.name}</span>
      ${f.count?`<span class="count">${f.count}</span>`:''}
    </button>`).join('');
  $('#labelsNav').innerHTML = Object.entries(LABELS).map(([k,l])=>`
    <button class="nav-item" data-label="${k}">
      <span class="dot" style="background:${l.color};margin:0 1px"></span>
      <span class="label">${l.name}</span>
    </button>`).join('');
}

/* ============================================================
   RENDER SCOPES
   ============================================================ */
function renderScopes(){
  $('#scopes').innerHTML = SCOPES.map(s=>`<button class="scope ${s===state.scope?'active':''}" data-scope="${s}">${s}</button>`).join('');
}

/* ============================================================
   RENDER LIST
   ============================================================ */
function filtered(){
  return EMAILS.filter(e=>{
    if(state.scope==='Unread' && !e.unread) return false;
    if(state.scope==='Starred' && !e.starred) return false;
    if(state.scope==='Has attachment' && !e.attachments.length) return false;
    if(state.search){
      const q=state.search.toLowerCase();
      if(!(e.sender+e.subject+e.snippet).toLowerCase().includes(q)) return false;
    }
    return true;
  });
}
function renderList(){
  const items = filtered();
  const groups = {};
  items.forEach(e=>{ (groups[e.group] ??= []).push(e); });
  const order = ['Today','Yesterday','This Week'];
  let html='';
  order.forEach(g=>{
    if(!groups[g]) return;
    html += `<div class="group-head">${g}</div>`;
    html += groups[g].map(rowHTML).join('');
  });
  if(!items.length) html = `<div style="padding:40px;text-align:center;color:var(--text-3)">No messages match your filters.</div>`;
  const list = $('#list');
  list.innerHTML = html;
  list.classList.toggle('selecting', state.checked.size>0);
}
function rowHTML(e){
  const sel = e.id===state.selectedId ? 'selected':'';
  const checked = state.checked.has(e.id);
  const labels = e.labels.map(chipFor).join('');
  const thr = e.thread.length>1 ? `<span class="thread-count">${e.thread.length}</span>` : '';
  const att = e.attachments.length ? `<span class="attach-ic">${ic('paperclip',14)}</span>`:'';
  return `
  <div class="row ${e.unread?'unread':'read'} ${sel} ${checked?'':''} compact-sub" data-id="${e.id}" data-subject="${e.subject.replace(/"/g,'&quot;')}" role="button" tabindex="0" aria-label="Email from ${e.sender}: ${e.subject}">
    <div class="checkwrap ${checked?'checked':''}" data-check="${e.id}">
      <div class="cb ${checked?'checked':''}">${ic('check',13)}</div>
    </div>
    <div class="ava-wrap">
      <span class="unread-dot"></span>
      <div class="avatar" style="${avatarStyle(e.sender)}">${initials(e.sender)}</div>
    </div>
    <div class="body">
      <div class="line1">
        <span class="sender">${e.sender}</span>
        ${thr}
        <span class="time">${e.time}</span>
      </div>
      <div class="subject">${e.subject}</div>
      <div class="snippet">${e.snippet}</div>
      ${(labels||att)?`<div class="chips">${labels}${att}</div>`:''}
    </div>
    <div class="actions">
      <button class="star ${e.starred?'on':''}" data-star="${e.id}" aria-label="${e.starred?'Unstar':'Star'} email" aria-pressed="${e.starred}">${ic('star',18)}</button>
      <div class="hover-actions">
        <button class="ha-btn" data-act="archive" data-id="${e.id}" aria-label="Archive" title="Archive">${ic('archive',16)}</button>
        <button class="ha-btn" data-act="snooze" data-id="${e.id}" aria-label="Snooze" title="Snooze">${ic('snooze',16)}</button>
        <button class="ha-btn danger" data-act="delete" data-id="${e.id}" aria-label="Delete" title="Delete">${ic('trash',16)}</button>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   RENDER READER
   ============================================================ */
function attCard(a){
  const map = {pdf:['#F43F5E','PDF'],doc:['#0EA5E9','DOC'],fig:['#8B5CF6','FIG'],default:['#6B7280','FILE']};
  const [color] = map[a.type]||map.default;
  return `<div class="att-card">
    <div class="att-icon" style="background:linear-gradient(135deg,${color},color-mix(in srgb,${color} 60%, #000))">${ic('paperclip',18)}</div>
    <div class="att-meta"><div class="att-name">${a.name}</div><div class="att-size">${a.size}</div></div>
  </div>`;
}
function msgHTML(m, isLast, atts){
  if(m.collapsed){
    return `<div class="msg collapsed" data-expand>
      <div class="msg-head">
        <div class="avatar" style="${avatarStyle(m.from)}">${initials(m.from)}</div>
        <div class="msg-from"><span class="nm">${m.from}</span></div>
        <div class="collapsed-snip">${m.snip||''}</div>
        <div class="msg-meta">${m.time}</div>
      </div>
      <div class="msg-body">${m.html}</div>
    </div>`;
  }
  return `<div class="msg">
    <div class="msg-head">
      <div class="avatar" style="${avatarStyle(m.from)}">${initials(m.from)}</div>
      <div class="msg-from">
        <div class="nm">${m.from}</div>
        <div class="addr">${m.email}</div>
        <div class="to">to ${m.to}</div>
      </div>
      <div class="msg-meta">${m.time}
        <button class="icon-btn" style="width:30px;height:30px" aria-label="Reply">${ic('reply',16)}</button>
        <button class="icon-btn" style="width:30px;height:30px" aria-label="More">${ic('more',16)}</button>
      </div>
    </div>
    <div class="msg-body">${m.html}</div>
    ${isLast && atts.length?`<div class="attachments">${atts.map(attCard).join('')}</div>`:''}
  </div>`;
}
function renderReader(){
  const r = $('#reader');
  const e = EMAILS.find(x=>x.id===state.selectedId);
  if(!e){
    r.innerHTML = `<div class="empty"><div class="inner">
      <div class="glyph">${ic('mailOpen',40)}</div>
      <h2>Nothing selected</h2>
      <p>Pick a conversation from the list to read it here. Your inbox is calm and under control.</p>
      <div class="hintrow"><span><span class="kbd2">↑</span> <span class="kbd2">↓</span> navigate</span><span><span class="kbd2">↵</span> open</span><span><span class="kbd2">C</span> compose</span></div>
    </div></div>`;
    return;
  }
  const labels = e.labels.map(chipFor).join('');
  r.innerHTML = `
    <div class="reader-scroll">
      <div class="thread-head">
        <div class="top">
          <button class="icon-btn back-btn" id="backBtn" aria-label="Back to list">${ic('back',18)}</button>
          <h1 class="thread-subject">${e.subject}</h1>
          <button class="star ${e.starred?'on':''}" data-star="${e.id}" aria-label="Star" style="margin-top:4px">${ic('star',22)}</button>
        </div>
        ${labels?`<div class="labels">${labels}</div>`:''}
      </div>
      <div class="action-bar">
        <button class="btn btn-primary" id="replyBtn">${ic('reply',16)} Reply</button>
        <button class="btn">${ic('replyAll',16)} Reply all</button>
        <button class="btn">${ic('forward',16)} Forward</button>
        <div class="sep"></div>
        <button class="icon-btn" data-act="archive" data-id="${e.id}" aria-label="Archive" title="Archive">${ic('archive',18)}</button>
        <button class="icon-btn" data-act="snooze" data-id="${e.id}" aria-label="Snooze" title="Snooze">${ic('snooze',18)}</button>
        <button class="icon-btn" data-act="delete" data-id="${e.id}" aria-label="Delete" title="Delete">${ic('trash',18)}</button>
        <div class="grow"></div>
        <button class="icon-btn" aria-label="More actions">${ic('more',18)}</button>
      </div>
      ${e.thread.map((m,i)=>msgHTML(m, i===e.thread.length-1, e.attachments)).join('')}
      <div class="reply-box">
        <div class="reply-head">${ic('reply',15)} <span>Reply to <span class="to-pill">${e.sender}</span></span></div>
        <textarea placeholder="Write your reply…" aria-label="Reply body"></textarea>
        <div class="reply-foot">
          <button class="btn btn-primary" data-send-reply>${ic('sent',16)} Send</button>
          <div class="fmt-bar">
            <button title="Bold" aria-label="Bold"><svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 4h8a4 4 0 0 1 0 8H6zM6 12h9a4 4 0 0 1 0 8H6z"/></svg></button>
            <button title="Attach" aria-label="Attach">${ic('paperclip',16)}</button>
          </div>
        </div>
      </div>
    </div>`;
  // mark read
  if(e.unread){ e.unread=false; renderList(); }
}

/* ============================================================
   TOASTS
   ============================================================ */
function toast(msg, kind='info', withUndo=false, onUndo){
  const colors={info:'var(--info)',success:'var(--success)',warning:'var(--warning)',danger:'var(--danger)'};
  const el=document.createElement('div'); el.className='toast';
  el.innerHTML=`<span class="ti" style="background:${colors[kind]}">${ic('check',14)}</span><span>${msg}</span>${withUndo?'<button class="undo">Undo</button>':''}`;
  $('#toasts').appendChild(el);
  let t=setTimeout(close,3200);
  function close(){ el.classList.add('out'); setTimeout(()=>el.remove(),220); }
  if(withUndo) el.querySelector('.undo').onclick=()=>{ clearTimeout(t); close(); onUndo&&onUndo(); };
}

/* ============================================================
   THEME
   ============================================================ */
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('aurora-theme',t);
  $('#themeIcon').innerHTML = t==='dark' ? I.sun : I.moon;
}
function initTheme(){
  const saved = localStorage.getItem('aurora-theme') || (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  setTheme(saved);
}

/* ============================================================
   COMPOSE
   ============================================================ */
function openCompose(){ $('#scrim').classList.add('show'); $('#composer').classList.add('show'); $('#cmpTo').focus(); }
function closeCompose(){ $('#scrim').classList.remove('show'); $('#composer').classList.remove('show'); }

/* ============================================================
   EVENTS
   ============================================================ */
function selectEmail(id){
  state.selectedId=id; document.body.classList.add('reading');
  renderList(); renderReader();
  $('#reader')?.querySelector('.reader-scroll')?.scrollTo(0,0);
}

document.addEventListener('click', e=>{
  const t=e.target;
  // nav folder
  const nav=t.closest('[data-folder]');
  if(nav){ state.folder=nav.dataset.folder; state.selectedId=null; renderNav(); renderList(); renderReader(); document.body.classList.remove('reading'); document.body.classList.remove('menu-open'); return; }
  const lab=t.closest('[data-label]');
  if(lab){ toast(`Filtered by “${LABELS[lab.dataset.label].name}”`,'info'); return; }
  // scope
  const sc=t.closest('[data-scope]');
  if(sc){ state.scope=sc.dataset.scope; renderScopes(); renderList(); return; }
  // checkbox
  const chk=t.closest('[data-check]');
  if(chk){ e.stopPropagation(); const id=+chk.dataset.check; state.checked.has(id)?state.checked.delete(id):state.checked.add(id); renderList(); return; }
  // star
  const st=t.closest('[data-star]');
  if(st){ e.stopPropagation(); const em=EMAILS.find(x=>x.id===+st.dataset.star); em.starred=!em.starred; renderList(); if(state.selectedId===em.id) renderReader(); toast(em.starred?'Added star':'Removed star', em.starred?'warning':'info'); return; }
  // hover/action bar acts
  const act=t.closest('[data-act]');
  if(act){ e.stopPropagation(); const id=+act.dataset.id; const a=act.dataset.act; doAction(a,id); return; }
  // expand collapsed
  const ex=t.closest('[data-expand]');
  if(ex){ ex.classList.remove('collapsed'); return; }
  // open row
  const row=t.closest('.row');
  if(row){ selectEmail(+row.dataset.id); return; }
});

function doAction(a,id){
  const labels={archive:['Archived',' success'],delete:['Moved to Trash','danger'],snooze:['Snoozed until tomorrow','info']};
  const idx=EMAILS.findIndex(x=>x.id===id); if(idx<0) return;
  const removed=EMAILS[idx]; EMAILS.splice(idx,1);
  if(state.selectedId===id){ state.selectedId=null; document.body.classList.remove('reading'); }
  renderList(); renderReader();
  const [msg,kind]=labels[a];
  toast(msg, kind.trim(), true, ()=>{ EMAILS.splice(idx,0,removed); renderList(); });
}

$('#list').addEventListener('keydown', e=>{
  const row=e.target.closest('.row'); if(!row) return;
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectEmail(+row.dataset.id); }
});

$('#collapseBtn').onclick=()=>$('#app').classList.toggle('collapsed');
$('#themeToggle').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
$('#densComfort').onclick=()=>{document.documentElement.setAttribute('data-density','comfortable');$('#densComfort').classList.add('active');$('#densCompact').classList.remove('active');};
$('#densCompact').onclick=()=>{document.documentElement.setAttribute('data-density','compact');$('#densCompact').classList.add('active');$('#densComfort').classList.remove('active');};
$('#composeBtn').onclick=openCompose;
$('#composeClose').onclick=closeCompose;
$('#composeTrash').onclick=()=>{closeCompose();toast('Draft discarded','danger');};
$('#scrim').onclick=closeCompose;
$('#ccToggle').onclick=()=>{ $('#ccField').hidden=!$('#ccField').hidden; $('#bccField').hidden=!$('#bccField').hidden; };
$('#sendBtn').onclick=()=>{ closeCompose(); toast('Message sent','success'); };
$('#menuToggle').onclick=()=>document.body.classList.toggle('menu-open');

// delegated reader buttons
$('#reader').addEventListener('click', e=>{
  if(e.target.closest('#backBtn')){ document.body.classList.remove('reading'); }
  if(e.target.closest('#replyBtn')){ $('#reader').querySelector('.reply-box textarea')?.focus(); $('#reader').querySelector('.reply-box')?.scrollIntoView({behavior:'smooth',block:'center'}); }
  if(e.target.closest('[data-send-reply]')){ const ta=$('#reader').querySelector('.reply-box textarea'); if(ta){ta.value='';} toast('Reply sent','success'); }
});

// search
$('#searchInput').addEventListener('input', e=>{ state.search=e.target.value; renderList(); });
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); $('#searchInput').focus(); $('#searchInput').select(); }
  if(e.key==='Escape'){ closeCompose(); }
  if(e.key.toLowerCase()==='c' && !/input|textarea/i.test(document.activeElement.tagName)){ openCompose(); }
});

/* ============================================================
   BOOT — with brief skeleton for "alive" feel
   ============================================================ */
function skeleton(){
  $('#list').innerHTML = Array.from({length:7}).map(()=>`
    <div class="skel-row"><div class="skel circ"></div>
      <div><div class="skel" style="height:13px;width:42%;margin-bottom:8px"></div>
      <div class="skel" style="height:11px;width:75%;margin-bottom:6px"></div>
      <div class="skel" style="height:11px;width:55%"></div></div></div>`).join('');
}
initTheme();
renderNav();
renderScopes();
skeleton();
setTimeout(()=>{ renderList(); renderReader(); }, 650);
</script>
